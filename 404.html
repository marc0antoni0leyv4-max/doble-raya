<!DOCTYPE html>
<html lang="es-419">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada · Doble raya</title>
<style>
  body { margin: 0; min-height: 100vh; font-family: 'Andika', 'Trebuchet MS', system-ui, sans-serif; color: #1b2747;
         background: #f6f9fe repeating-linear-gradient(to bottom, transparent 0 31px, #dbe7f7 31px 32px); }
  main { max-width: 40rem; padding: 5rem 1.5rem; margin: 0 auto; }
  h1 { font-size: 2rem; margin: 0 0 .5rem; }
  p { color: #4a5878; line-height: 1.5; margin: 0; }
  a { display: inline-flex; align-items: center; min-height: 48px; margin-top: 1.5rem; padding: 0 1.25rem;
      background: #1b2747; color: #fff; border-radius: 12px; font-weight: 700; text-decoration: none; }
  a:focus-visible { outline: 3px solid #1f6fc4; outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <h1>Esta página no existe</h1>
  <p>Puede que el enlace esté mal escrito. Vuelve al inicio para elegir un juego.</p>
  <a id="inicio" href="/">Ir al inicio</a>
</main>
<script>
  // En GitHub Pages de proyecto el sitio vive en /nombre-del-repo/
  if (/\.github\.io$/.test(location.hostname)) {
    var seg = location.pathname.split('/')[1];
    if (seg) document.getElementById('inicio').href = '/' + seg + '/';
  }
</script>
</body>
</html>
